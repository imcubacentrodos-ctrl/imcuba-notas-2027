<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMCUBA Notas 2027 | Acceso</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#102c4b;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:22px}
    .panel{width:min(100%,470px);background:#1c4265;border-radius:20px;padding:34px 26px;text-align:center;box-shadow:0 16px 36px #071a2d55}
    h1{color:#e8c56b;font-size:clamp(28px,7vw,40px);margin:0 0 10px}h2{font-size:23px;margin:14px 0 24px}p{line-height:1.5}
    label{display:block;text-align:left;margin:15px 0 7px}input{width:100%;padding:14px;border-radius:10px;border:1px solid #b9c8d5;font-size:16px}
    button{width:100%;margin-top:20px;background:#e8c56b;color:#102c4b;border:0;border-radius:10px;padding:15px;font-size:17px;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}.muted{color:#d4e0e9;font-size:14px}.message{min-height:24px;margin-top:18px;overflow-wrap:anywhere}
    .hidden{display:none}hr{border:0;border-top:1px solid #a9bfd0;margin:22px 0}
  </style>
</head>
<body>
  <main class="panel">
    <h1>IMCUBA Notas 2027</h1>
    <p class="muted">Instituto de Educaci&oacute;n B&aacute;sica por Cooperativa<br>Centro No. Dos, Parcelamiento La M&aacute;quina</p>
    <hr>
    <section id="login">
      <h2>Iniciar sesi&oacute;n</h2>
      <form id="loginForm">
        <label for="email">Correo electr&oacute;nico</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Contrase&ntilde;a</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button id="loginBtn" type="submit">Ingresar</button>
      </form>
      <p class="muted">Las cuentas son autorizadas por Direcci&oacute;n.</p>
    </section>
    <section id="welcome" class="hidden">
      <h2>Acceso verificado</h2>
      <p id="userName"></p>
      <p id="userRole"></p>
      <p class="muted">Los m&oacute;dulos acad&eacute;micos y los permisos por curso est&aacute;n en desarrollo.</p>
      <button id="salir" type="button">Cerrar sesi&oacute;n</button>
    </section>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://cwbjfsnqghlpbegdesuy.supabase.co';
    const SUPABASE_PUBLIC_KEY = 'sb_publishable_nsrJRjcBcLOnKU-rZneE5Q_n86nSsT4';
    const message = document.getElementById('message');
    const login = document.getElementById('login');
    const welcome = document.getElementById('welcome');
    const loginBtn = document.getElementById('loginBtn');
    let client;
    function showMessage(value) { message.textContent = value; }
    function showLogin() { login.classList.remove('hidden'); welcome.classList.add('hidden'); }
    async function loadProfile() {
      const { data: userData, error: userError } = await client.auth.getUser();
      if (userError || !userData.user) { showLogin(); return; }
      const { data: profile, error: profileError } = await client.from('perfiles')
        .select('nombre_completo, rol, activo').eq('id', userData.user.id).single();
      if (profileError || !profile || profile.activo !== true || !['director','docente'].includes(profile.rol)) {
        await client.auth.signOut();
        showLogin();
        showMessage('Esta cuenta no tiene un perfil activo y autorizado. Consulta a Direcci\u00f3n.');
        return;
      }
      document.getElementById('userName').textContent = profile.nombre_completo || 'Usuario';
      document.getElementById('userRole').textContent = profile.rol === 'director' ? 'Rol: Direcci\u00f3n' : 'Rol: Docente';
      login.classList.add('hidden'); welcome.classList.remove('hidden');
      showMessage('Sesi\u00f3n iniciada correctamente.');
    }
    async function initialize() {
      if (!window.supabase) { showMessage('No se pudo cargar la conexi\u00f3n. Revisa tu Internet y recarga.'); return; }
      client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLIC_KEY);
      try { await loadProfile(); } catch { showMessage('No fue posible verificar la sesi\u00f3n. Intenta nuevamente.'); }
    }
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  if (!client) { showMessage('Conexi\u00f3n no disponible. Recarga la p\u00e1gina.'); return; }
  loginBtn.disabled = true; showMessage('Verificando credenciales...');
  try {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) { showMessage('No se pudo iniciar sesi\u00f3n. Verifica el correo y la contrase\u00f1a.'); return; }
    await loadProfile();
  } catch { showMessage('Ocurri\u00f3 un problema de conexi\u00f3n. Intenta nuevamente.'); }
  finally { loginBtn.disabled = false; }
});
document.getElementById('salir').addEventListener('click', async () => {
  if (client) await client.auth.signOut();
  showLogin(); showMessage('Sesi\u00f3n cerrada.');
});
    initialize();
  </script>
</body>
</html>
